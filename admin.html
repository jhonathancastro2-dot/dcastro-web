<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel D'CASTRO</title>

<style>

body{
    margin:0;
    background:#f5f5f5;
    font-family:Arial;
}

header{
    background:#8B0000;
    color:white;
    padding:20px;
    text-align:center;
}

#pedidos{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.tarjeta{
    background:white;
    border-radius:12px;
    margin-bottom:20px;
    padding:20px;
    box-shadow:0 3px 8px rgba(0,0,0,.2);
}

.estado{
    color:white;
    padding:6px 12px;
    border-radius:20px;
    display:inline-block;
    font-weight:bold;
    background:#ff9800;
}

button{

padding:10px 15px;

margin:5px;

border:none;

border-radius:8px;

cursor:pointer;

font-weight:bold;

}

.aceptar{
background:#2196f3;
color:white;
}

.preparando{
background:#ff9800;
color:white;
}

.camino{
background:#9c27b0;
color:white;
}

.entregado{
background:#4caf50;
color:white;
}

</style>

</head>

<body>

<header>

<h1>📋 Panel de Pedidos D'CASTRO</h1>

</header>

<div id="pedidos">

<h2>No hay pedidos todavía.</h2>

</div>

</body>
</html>
